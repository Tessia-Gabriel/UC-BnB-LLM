max_iterations: 2
checkpoint_interval: 1
random_seed: 42
log_level: INFO
language: python
llm:
  key_set: configs/phase_minus1/mock_key_set.yaml
  models:
    - name: phase-minus1-mock
      api_base: http://127.0.0.1:18080/v1
      api_key: phase-minus1-no-secret
      weight: 1.0
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  timeout: 30
  retries: 0
  retry_delay: 0
database:
  population_size: 16
  archive_size: 4
  num_islands: 1
  log_prompts: true
evaluator:
  timeout: 600
  max_retries: 0
  cascade_evaluation: true
  cascade_thresholds: [0.5]
  parallel_evaluations: 1
diff_based_evolution: false
