max_iterations: 1
checkpoint_interval: 1
log_level: INFO
random_seed: 42

llm:
  key_set: ./configs/phase_minus1/mock_key_set.yaml
  models:
    - name: phase-minus1-mock
      api_base: http://127.0.0.1:18080/v1
      api_key: phase-minus1-no-secret
      weight: 1.0
  evaluator_models:
    - name: phase-minus1-mock
      api_base: http://127.0.0.1:18080/v1
      api_key: phase-minus1-no-secret
      weight: 1.0
  temperature: 0.0
  top_p: 1.0
  max_tokens: 1024
  timeout: 30
  retries: 0
  retry_delay: 0

prompt:
  num_top_programs: 1
  num_diverse_programs: 0
  use_template_stochasticity: false
  system_message: >-
    Design a valid, inexpensive variable-scoring function for branch-and-bound.

database:
  population_size: 8
  archive_size: 4
  num_islands: 1
  migration_interval: 100
  migration_rate: 0.1
  elite_selection_ratio: 0.25
  exploration_ratio: 0.25
  exploitation_ratio: 0.75
  random_seed: 42
  log_prompts: true

evaluator:
  timeout: 300
  max_retries: 0
  cascade_evaluation: true
  cascade_thresholds: [0.0]
  parallel_evaluations: 1
  use_llm_feedback: false

diff_based_evolution: false
allow_full_rewrites: true
max_code_length: 10000

